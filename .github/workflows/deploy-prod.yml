name: Deploy → Production

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_PREFIX: portfolio
  ECS_CLUSTER: portfolio-prod

# Garante que apenas um deploy rode por vez.
# cancel-in-progress: false — espera o deploy atual terminar antes de iniciar o próximo.
# Um deploy cancelado no meio pode deixar serviços em estado inconsistente.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write        # obrigatório para OIDC
  contents: read
  security-events: write # upload de SARIF para GitHub Security tab

jobs:
  # ── 1. Quality Gate ─────────────────────────────────────────────────
  # Roda lint (ruff) e testes (pytest) em todos os serviços Python.
  # Se qualquer checagem falhar, o pipeline para antes de fazer qualquer build.
  quality-gate:
    name: Quality Gate — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        service: [gateway, auth-service, blog-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Instala dependencias
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: Lint — ruff
        working-directory: services/${{ matrix.service }}
        # ruff é ~100x mais rápido que flake8 e compatível com as mesmas regras
        run: |
          pip install ruff
          ruff check app/

      - name: Testes — pytest
        working-directory: services/${{ matrix.service }}
        # Cria um .env mínimo para a aplicação não explodir nos imports
        run: |
          if [ -f tests/ ] || [ -d tests/ ]; then
            pip install pytest pytest-asyncio httpx
            pytest tests/ -v --tb=short
          else
            echo "Sem testes encontrados em ${{ matrix.service }} — pulando."
          fi

  # ── 2. Quality Gate: Frontend ─────────────────────────────────────
  quality-gate-frontend:
    name: Quality Gate — frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependencias
        working-directory: frontend
        run: npm ci

      - name: Build de validacao
        working-directory: frontend
        run: npm run build

  # ── 3. Build, Security Scan e Push (paralelo por serviço) ──────────
  build-and-push:
    name: Build & Push — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [quality-gate, quality-gate-frontend]

    strategy:
      fail-fast: false # se um serviço falhar no scan, os outros continuam
      matrix:
        service:
          - name: gateway
            context: ./services/gateway
          - name: auth-service
            context: ./services/auth-service
          - name: blog-service
            context: ./services/blog-service
          - name: frontend
            context: ./frontend

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Gera tag da imagem
        id: meta
        # SHA curto = rastreável até o commit exato que originou a imagem
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # OIDC: sem credenciais estáticas. O GitHub negocia um token temporário
      # de 15 minutos com a AWS a cada execução do workflow.
      - name: Configura credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/portfolio-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # BuildKit inline cache: reutiliza layers do :latest como cache.
      # Reduz o tempo de build de imagens Python pesadas em ~60%.
      - name: Build da imagem Docker
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
          SERVICE: ${{ matrix.service.name }}
        run: |
          docker build \
            --cache-from "$REGISTRY/$ECR_PREFIX/$SERVICE:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --target production \
            -t "$REGISTRY/$ECR_PREFIX/$SERVICE:$TAG" \
            -t "$REGISTRY/$ECR_PREFIX/$SERVICE:latest" \
            ${{ matrix.service.context }}

          echo "image=$REGISTRY/$ECR_PREFIX/$SERVICE:$TAG" >> $GITHUB_OUTPUT

      # Trivy escaneia a imagem ANTES do push para o ECR.
      # exit-code: 1 = falha o job se encontrar CRITICAL.
      # ignore-unfixed: true = ignora CVEs sem patch disponível
      # (não bloquear o time por vulnerabilidade que não tem correção).
      - name: Security Scan — Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload scan para GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Push apenas se o scan passou
      - name: Push para ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
          SERVICE: ${{ matrix.service.name }}
        run: |
          docker push "$REGISTRY/$ECR_PREFIX/$SERVICE:$TAG"
          docker push "$REGISTRY/$ECR_PREFIX/$SERVICE:latest"

  # ── 4. Deploy no ECS com Rolling Update ────────────────────────────
  deploy-ecs:
    name: Deploy — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production # requer aprovação manual (configure em Settings > Environments)

    strategy:
      max-parallel: 2   # deploya 2 serviços por vez — mais rápido que serial, mais seguro que todos juntos
      fail-fast: false
      matrix:
        service:
          - name: gateway
            ecs-service: gateway
            task-family: portfolio-gateway
          - name: auth-service
            ecs-service: auth-service
            task-family: portfolio-auth-service
          - name: blog-service
            ecs-service: blog-service
            task-family: portfolio-blog-service
          - name: frontend
            ecs-service: frontend
            task-family: portfolio-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/portfolio-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Registra uma nova revisão da Task Definition com a imagem do commit atual.
      # Diferença crítica em relação a --force-new-deployment:
      # --force usa a task definition atual (que pode ter a imagem :latest cacheada).
      # Aqui forçamos a imagem com a tag exata do commit → deploy determinístico.
      - name: Registra nova Task Definition
        id: task-def
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ matrix.service.name }}
          FAMILY: ${{ matrix.service.task-family }}
        run: |
          SHORT_TAG="${GITHUB_SHA::7}"
          NEW_IMAGE="$REGISTRY/$ECR_PREFIX/$SERVICE:$SHORT_TAG"

          CURRENT=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query taskDefinition \
            --output json)

          NEW=$(echo "$CURRENT" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy)')

          NEW_ARN=$(echo "$NEW" | aws ecs register-task-definition \
            --cli-input-json file:///dev/stdin \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          echo "task-def-arn=$NEW_ARN" >> $GITHUB_OUTPUT
          echo "Registrada: $NEW_ARN"

      # Rolling Update com Zero Downtime:
      # minimumHealthyPercent=100: nunca desce abaixo de 2 tasks durante o deploy
      # maximumPercent=200: pode subir até 4 tasks temporariamente (2 novas + 2 antigas)
      # O ALB só manda tráfego para as novas tasks depois que passarem no health check.
      # Só então as tasks antigas são terminadas.
      - name: Rolling Update no ECS Service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ matrix.service.ecs-service }}" \
            --task-definition "${{ steps.task-def.outputs.task-def-arn }}" \
            --deployment-configuration "minimumHealthyPercent=100,maximumPercent=200"

      # Se o serviço não estabilizar em 10 minutos, o deployment_circuit_breaker
      # configurado no Terraform executa rollback automático para a revisão anterior.
      - name: Aguarda estabilizacao
        timeout-minutes: 10
        run: |
          echo "Aguardando ${{ matrix.service.ecs-service }} estabilizar..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "${{ matrix.service.ecs-service }}"
          echo "OK — ${{ matrix.service.ecs-service }} estavel."

      - name: Notifica falha
        if: failure()
        run: |
          echo "::error::Deploy de ${{ matrix.service.name }} falhou."
          echo "O deployment circuit breaker do ECS esta executando rollback automatico."
          echo "Verifique os logs em: CloudWatch > /ecs/portfolio/${{ matrix.service.name }}"
